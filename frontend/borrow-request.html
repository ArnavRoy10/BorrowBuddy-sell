<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Request - BorrowBuddy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="bottom-nav.css">
    <style>
        .borrow-request-container {
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .item-preview {
            display: flex;
            gap: 1rem;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .item-preview-info h3 { margin: 0 0 .25rem; font-size: 1.1rem; }
        .form-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-section h2 {
            font-size: 1.05rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        #durationDisplay {
            text-align: center;
            padding: .75rem;
            background: #f9fafb;
            border-radius: 10px;
            font-weight: 600;
            font-size: .9rem;
        }
        textarea#borrowMessage {
            width: 100%;
            padding: .75rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: .9rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        .btn-submit-request {
            width: 100%;
            padding: .9rem;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
    <!-- BorrowBuddy UX modules -->
    <link rel="stylesheet" href="skeletons.css">
    <link rel="stylesheet" href="empty-states.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="stylesheet" href="pwa.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand"><i class="fas fa-exchange-alt"></i> <span>BorrowBuddy</span></div>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
                <a href="browse.html" class="nav-item"><i class="fas fa-search"></i> Browse</a>
                <a href="dashboard-enhanced.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Cart <span class="badge" id="cartBadge">0</span></a>
                <a href="disputes.html" class="nav-item"><i class="fas fa-shield-halved"></i> Disputes</a>
                <a href="#" onclick="logout()" class="nav-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
            <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <main class="borrow-request-container">
        <h1 style="font-size:1.5rem;margin-bottom:1.5rem"><i class="fas fa-hand-holding"></i> Request to Borrow</h1>

        <div class="item-preview" id="itemPreview">
            <!-- Filled by borrow-request.js -->
        </div>

        <form id="borrowRequestForm">
            <div class="form-section">
                <h2><i class="fas fa-calendar-alt" style="color:#2563eb"></i> Select Borrow Dates</h2>
                <p style="font-size:.82rem;color:#6b7280;margin-bottom:1rem">
                    Click a start date, then an end date. Red dates are already borrowed, yellow dates have a pending request.
                </p>

                <!-- Availability calendar renders here -->
                <div id="availabilityCalendarContainer" style="margin-bottom:1rem"></div>

                <div id="durationDisplay">Select dates on the calendar above</div>
            </div>

            <div class="form-section">
                <h2><i class="fas fa-comment-dots" style="color:#2563eb"></i> Message to Owner (optional)</h2>
                <textarea id="borrowMessage" rows="3" placeholder="Let the owner know why you need this item, or ask any questions..."></textarea>
            </div>

            <button type="submit" class="btn-submit-request">
                <i class="fas fa-arrow-right"></i> Continue
            </button>
        </form>
    </main>

    <script src="config.js"></script>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
    <script src="availability-calendar.js"></script>
    <script src="borrow-request.js"></script>
    <script src="notifications.js"></script>
    <script>
        document.getElementById('navToggle')?.addEventListener('click', () => {
            document.getElementById('navMenu')?.classList.toggle('active');
        });
    </script>
    <script src="bottom-nav.js"></script>
    <script src="skeletons.js"></script>
    <script src="empty-states.js"></script>
    <script src="onboarding.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
