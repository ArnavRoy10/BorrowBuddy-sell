<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BorrowBuddy</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="premium.css">
    <!-- BorrowBuddy UX modules -->
    <link rel="stylesheet" href="skeletons.css">
    <link rel="stylesheet" href="empty-states.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="stylesheet" href="pwa.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <!-- Back to Home -->
    <div class="back-to-home">
        <a href="index.html">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="hero-blob-field" aria-hidden="true">
            <span class="liquid-blob blob-a"></span>
            <span class="liquid-blob blob-b"></span>
            <span class="liquid-blob blob-d"></span>
        </div>
        <!-- Auth Card -->
        <div class="auth-card glass-card-strong">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-exchange-alt"></i>
                    <span>BorrowBuddy</span>
                </div>
                <h2>Forgot Password?</h2>
                <p>Don't worry! Enter your email and we'll help you reset your password</p>
            </div>

            <!-- Forgot Password Form -->
            <form class="auth-form" id="forgotPasswordForm">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-auth">
                    <i class="fas fa-paper-plane"></i> Send Reset Instructions
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleForgotPassword();
        });

        function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();

            // Clear previous messages
            clearMessages();

            // Validation
            if (!email) {
                showError('Please enter your email address');
                return;
            }

            if (!validateEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            // Check if email exists
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            const userExists = Object.values(users).some(user => user.email === email);

            if (!userExists) {
                showError('No account found with this email address');
                return;
            }

            // Show success message (mock - not actually sending email)
            showSuccess('Password reset instructions have been sent to your email!');
            
            // Show loading state
            const submitBtn = document.querySelector('.btn-auth');
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Sending...';

            // Redirect to login after delay
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }

        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function showError(message) {
            clearMessages();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-circle"></i>
                <span>${message}</span>
            `;
            const form = document.querySelector('.auth-form');
            form.insertBefore(errorDiv, form.firstChild);
        }

        function showSuccess(message) {
            clearMessages();
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <span>${message}</span>
            `;
            const form = document.querySelector('.auth-form');
            form.insertBefore(successDiv, form.firstChild);
        }

        function clearMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(msg => {
                msg.remove();
            });
        }
    </script>
    <script src="storage-sync.js"></script>
    <script src="premium.js"></script>
    <script src="skeletons.js"></script>
    <script src="empty-states.js"></script>
    <script src="onboarding.js"></script>
    <script src="pwa.js"></script>
    <script src="console-brand.js"></script>
</body>
</html>
