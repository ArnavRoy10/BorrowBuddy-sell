<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BorrowBuddy</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="premium.css">
    <!-- BorrowBuddy UX modules -->
    <link rel="stylesheet" href="skeletons.css">
    <link rel="stylesheet" href="empty-states.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="stylesheet" href="pwa.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <!-- Back to Home -->
    <div class="back-to-home">
        <a href="index.html">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="hero-blob-field" aria-hidden="true">
            <span class="liquid-blob blob-a"></span>
            <span class="liquid-blob blob-b"></span>
            <span class="liquid-blob blob-d"></span>
        </div>
        <!-- Auth Card -->
        <div class="auth-card glass-card-strong">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 19a9 9 0 1 1 8 13" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/><path d="M33 29a9 9 0 1 1-8-13" stroke="#fff" stroke-width="4.2" stroke-linecap="round" opacity="0.65"/><path d="M19 15l-4 4 4 4" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 33l4-4-4-4" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/></svg></span>
                    <span>BorrowBuddy</span>
                </div>
                <h2>Welcome Back!</h2>
                <p>Sign in to continue to your account</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <!-- Username Input -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="fas fa-user"></i>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Enter your username"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-row">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>Or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="btn-social btn-google" onclick="handleGoogleLogin()">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="storage-sync.js"></script>
    <script src="premium.js"></script>
    <script src="skeletons.js"></script>
    <script src="empty-states.js"></script>
    <script src="onboarding.js"></script>
    <script src="pwa.js"></script>
    <script src="console-brand.js"></script>
</body>
</html>
